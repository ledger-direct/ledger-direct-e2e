name: CI

# The harness's own checks on every pull request and every push to main: type check, the unit tests
# (offline, no testnet, no secrets) and the build. The plugin repositories' e2e workflows check out
# main of this repository and build it, so main must always build.

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to GitHub.
permissions:
  contents: read

# A newer push to the same pull request cancels its run in progress. Every other run gets a group of
# its own: GitHub keeps only one pending run per group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Type check, tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Every external action is referenced by a full commit SHA, with its version as a comment: a tag
  # can be moved to other code, a commit cannot. Dependabot keeps the SHAs current.
  pinned:
    name: Actions pinned to commit SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every external action is pinned to a full commit SHA
        run: |
          # The key is spelled apart, so this file does not match its own pattern.
          key=uses
          unpinned=$(grep -rnoE "${key}:\s*[^ #]+" .github/ | grep -v "${key}: \./" | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Actions not pinned to a full commit SHA (owner/action@<sha> # vX.Y.Z):"
            echo "$unpinned"
            exit 1
          fi
