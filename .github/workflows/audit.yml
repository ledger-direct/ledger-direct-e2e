name: Audit

# Known vulnerabilities in the dependencies (package-lock.json): weekly, on demand, and on every pull request
# or push that changes package-lock.json or this file. Fails on high and critical advisories in the runtime
# dependencies; all others are listed in the log without failing the run.

on:
  push:
    branches: [main]
    paths: [package-lock.json, .github/workflows/audit.yml]
  pull_request:
    paths: [package-lock.json, .github/workflows/audit.yml]
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

# Reads the repository, nothing else.
permissions:
  contents: read

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: All advisories (listed, not failing)
        run: npm audit || true
      - name: No high or critical advisory in the runtime dependencies
        run: npm audit --omit=dev --audit-level=high
